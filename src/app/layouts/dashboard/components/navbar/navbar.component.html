
<nav class="navbar navbar-expand navbar__container">

  <!-- Brand -->
  <a class="navbar__brand" routerLink="/dashboard">
    <div class="navbar__brand-icon">
      <i class="bi bi-grid-1x2-fill"></i>
    </div>

    <span>MyPlatform</span>
  </a>

  <!-- User information -->
  <div class="navbar__user">

    <div class="navbar__user-info">
      <span class="navbar__user-name">
        {{ $user().nombre }}
      </span>

      <span class="navbar__user-role">
        {{ $user().rol }}
      </span>
    </div>

    <!-- User menu -->
    <div class="navbar__user-menu">

      <button
        type="button"
        class="navbar__user-button"
        (click)="toggleUserMenu()"
        [attr.aria-expanded]="showUserMenu()"
        aria-label="Opciones del usuario"
      >
        <span class="navbar__avatar">
          {{ getInitials($user().nombre) }}
        </span>

        <i
          class="bi"
          [class.bi-chevron-down]="!showUserMenu()"
          [class.bi-chevron-up]="showUserMenu()"
        ></i>
      </button>

      @if (showUserMenu()) {
        <div class="navbar__dropdown">

          <div class="navbar__dropdown-header">
            <strong>{{ $user().nombre }}</strong>
            <span>{{ $user().email }}</span>
          </div>

          <div class="navbar__dropdown-divider"></div>

          <a
            routerLink="/profile"
            class="navbar__dropdown-item"
            (click)="closeUserMenu()"
          >
            <i class="bi bi-person"></i>
            Mi perfil
          </a>

          <a
            routerLink="/settings"
            class="navbar__dropdown-item"
            (click)="closeUserMenu()"
          >
            <i class="bi bi-gear"></i>
            Configuración
          </a>

          <div class="navbar__dropdown-divider"></div>

          <button
            type="button"
            class="navbar__dropdown-item navbar__dropdown-item--danger"
            (click)="logout()"
          >
            <i class="bi bi-box-arrow-right"></i>
            Cerrar sesión
          </button>

        </div>
      }

    </div>

  </div>

</nav>
