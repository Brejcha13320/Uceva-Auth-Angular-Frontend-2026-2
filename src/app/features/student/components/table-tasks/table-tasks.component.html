<div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">

        <thead class="table-light">
            <tr>
                <th scope="col">Titulo</th>
                <th scope="col">Prioridad</th>
                <th scope="col">Fecha Creación</th>
                <th scope="col">Estado</th>
                <th scope="col" class="text-center">Opciones</th>
            </tr>
        </thead>

        <tbody>
            @for (task of tasks; track task.id) {
                <tr>
                    <td class="fw-semibold">
                        {{ task.titulo }}
                    </td>

                    <td>
                        <span class="badge text-bg-info">
                            {{ task.prioridad }}
                        </span>
                    </td>

                    <td>
                        <span class="badge text-bg-info">
                            {{ task.createdAt | date }}
                        </span>
                    </td>

                    <td>
                        <span class="badge rounded-pill"
                              [ngClass]="{
                                'text-bg-success': task.estado === 'COMPLETADA',
                                'text-bg-warning': task.estado === 'PENDIENTE',
                                'text-bg-info': task.estado === 'PROCESO'
                              }">
                            {{ task.estado }}
                        </span>
                    </td>

                    <!-- Options -->
                    <td>
                        <div class="d-flex justify-content-center gap-2">
                            <app-button [config]="configDetailButton" (onClick)="click(task.id, 'detail')" />
                            <app-button [config]="configEditButton" (onClick)="click(task.id, 'edit')" />
                            <app-button [config]="configDeleteButton" (onClick)="click(task.id, 'delete')" />
                        </div>
                    </td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="9" class="text-center py-4 text-muted">
                        No hay tareas registrados.
                    </td>
                </tr>
            }
        </tbody>

    </table>
</div>
